<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Perfherder Noise Analysis</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>Speedometer3 Noise Analysis</h2>
  <div class="controls">
    Time range:
    <select id="days">
      <option value="7">7 days</option>
      <option value="14">14 days</option>
      <option value="30" selected>30 days</option>
      <option value="60">60 days</option>
      <option value="90">90 days</option>
    </select>
  </div>
  <div id="status">Loading...</div>
  <table id="results" hidden>
    <thead>
      <tr>
        <th>Platform</th>
        <th>Signature</th>
        <th>N</th>
        <th>Mean</th>
        <th>P25</th>
        <th>P50</th>
        <th>P75</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="chart"></div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>

</html>
